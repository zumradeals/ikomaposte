# docker-compose.yml — IKOMA node_server
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-ikomaposte}
    restart: unless-stopped
    # ⚠️ BIND LOCAL UNIQUEMENT — Caddy Gateway route le trafic
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "ikoma.managed=true"
      - "ikoma.profile=node_server"
      - "ikoma.app=${APP_NAME:-ikomaposte}"
